<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CGPA Tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>

<body>

<button id="themeToggle">⚙️</button>

<button class="toggle" onclick="toggleTheme()">
🌓 Theme
</button>

<div class="theme-panel">

<h3>🎨 Theme Studio</h3>

<div class="theme-buttons">

<button class="theme-btn" onclick="setTheme('ocean')" style="background:#3b82f6"></button>

<button class="theme-btn" onclick="setTheme('emerald')" style="background:#22c55e"></button>

<button class="theme-btn" onclick="setTheme('purple')" style="background:#8b5cf6"></button>

<button class="theme-btn" onclick="setTheme('gold')" style="background:#f59e0b"></button>

<button class="theme-btn" onclick="setTheme('crimson')" style="background:#ef4444"></button>

<button class="theme-btn" onclick="setTheme('midnight')" style="background:#111827"></button>

</div>

<div class="color-picker">

<label>Custom Accent Color</label>

<input
type="color"
id="accentPicker"
value="#4f46e5">

</div>

</div>

<div class="container">

<div class="hero">
<h1>🎓 CGPA Calculator</h1>
<p class="subtitle">(For a 4-year Undergraduate Course)</p>
<p class="subtitle">Calculate your CGPA</p>
</div>

<div class="grid">

<div class="card">

<h2>CGPA Calculator</h2>

<label>Semesters Completed</label>

<select id="semesterCount">
<option value="">Select</option>
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6</option>
<option value="7">7</option>
<option value="8">8</option>
</select>

<div id="gpaInputs"></div>

<button onclick="calculateCGPA()">Calculate CGPA</button>

</div>

<div class="card">

<h2>Results</h2>

<div class="result" id="cgpaDisplay">0.00</div>

<div class="classification" id="classification">
Awaiting Calculation
</div>

<div class="progress">
<div class="bar" id="progressBar"></div>
</div>

<div class="stats">

<div class="stat">
<h3 id="highest">0</h3>
<p>Highest GPA</p>
</div>

<div class="stat">
<h3 id="lowest">0</h3>
<p>Lowest GPA</p>
</div>

<div class="stat">
<h3 id="remaining">8</h3>
<p>Remaining</p>
</div>

<div class="stat">
<h3 id="average">0</h3>
<p>Average GPA</p>
</div>

</div>

<div id="badges" class="badges"></div>

</div>

</div>

<div class="card">
<h2>Performance Trend</h2>
<canvas id="trendChart"></canvas>
</div>

<div class="card">

<h2>CGPA Predictor</h2>

<label>Expected GPA For Remaining Semesters</label>

<input
type="number"
id="futureGpa"
min="0"
max="5"
step="0.01">

<button onclick="predictCGPA()">
Predict Graduation CGPA
</button>

<h2 id="prediction"></h2>

</div>

</div>

<script src="js/app.js"></script>

</body>
</html>
